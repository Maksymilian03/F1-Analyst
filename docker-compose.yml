services:
  f1analyst:
    build: .
    container_name: f1analyst
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      F1_STATS_BASE_URL: ${F1_STATS_BASE_URL}
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
